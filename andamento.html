<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Readingpedia · Em andamento</title>
<style>
:root{--bg:#f4f1f7;--bg-light:#faf8fc;--card:#fff;--border:#e5e0eb;--border-strong:#d6cfe0;--text:#2d2a32;--muted:#6b6478;--accent:#6c4dc0;--accent-soft:#f2e3ff;--success:#27856d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif}
header{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 24px;background:var(--card);border-bottom:2px solid var(--border-strong)}
header h1{margin:0;font-size:24px;color:var(--accent)}.header-buttons{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;transition:.2s}.header-buttons button,.primary-btn{background:var(--accent);border:0;border-radius:8px;color:white;padding:9px 13px}
.header-buttons button:hover,.primary-btn:hover{filter:brightness(.92);transform:translateY(-1px)}.header-buttons .active{background:#4f378f}
main{max-width:1300px;margin:22px auto;padding:0 18px}.intro{margin:12px 0 20px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
h2{font-size:26px;margin:4px 0;color:var(--accent)}.subtitle{color:var(--muted);font-size:14px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.stat{background:var(--card);border:1px solid var(--border);padding:15px;border-radius:10px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}.stat strong{font-size:23px}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin:18px 0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section h3{font-size:17px;margin:0}.search-row{display:flex;gap:8px;margin-top:12px}
input,textarea{font:inherit;color:var(--text);background:var(--bg-light);border:1px solid var(--border-strong);border-radius:8px;padding:10px;outline:none;min-width:0}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.search-row input{flex:1}
.catalog-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.catalog-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:8px;min-width:0}
.catalog-item img{width:42px;height:60px;object-fit:cover;border-radius:3px;background:var(--bg)}.catalog-info{flex:1;min-width:0}
.catalog-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catalog-info small{display:block;color:var(--muted);font-size:12px}
.catalog-item button{border:1px solid var(--border-strong);background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:7px 9px;font-size:12px;white-space:nowrap}
.books-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book-card{display:flex;background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:0}
.cover{flex:0 0 112px;background:var(--bg-light)}.cover img{width:100%;height:100%;min-height:190px;object-fit:cover;display:block}
.book-content{flex:1;min-width:0;padding:13px;display:flex;flex-direction:column;gap:8px}.book-title{font-size:16px;font-weight:700;line-height:1.25}
.author{font-size:13px;color:var(--muted);font-weight:600}.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 7px;border-radius:5px;background:#f3e8ff;color:#8051b5}.chip.pages{background:#eef5ff;color:#3b5ed7}
.progress-line{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
progress{width:100%;height:9px;appearance:none;border:0;border-radius:9px;overflow:hidden}progress::-webkit-progress-bar{background:#eee9f3;border-radius:9px}progress::-webkit-progress-value{background:var(--accent);border-radius:9px}progress::-moz-progress-bar{background:var(--accent);border-radius:9px}
.progress-controls{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}.progress-controls input[type=range]{width:100%;padding:0;accent-color:var(--accent);background:transparent}.progress-controls input[type=number]{width:70px;padding:6px}
.notes{width:100%;min-height:54px;resize:vertical;font-size:12px}.card-actions{display:flex;justify-content:space-between;gap:8px}
.card-actions button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.card-actions .finish{color:var(--success);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--bg-light);border:1px dashed var(--border-strong);border-radius:10px}.empty strong{display:block;color:var(--text);margin-bottom:5px}
.toast{position:fixed;bottom:18px;right:18px;background:#30283d;color:white;padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:850px){.books-grid,.catalog-results{grid-template-columns:1fr}}@media(max-width:600px){header{align-items:flex-start;flex-direction:column;padding:12px 16px}.header-buttons{width:100%}.header-buttons button{flex:1}main{padding:0 12px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:19px}.stat b{font-size:10px}.section{padding:13px}.search-row{flex-direction:column}.cover{flex-basis:95px}.cover img{min-height:165px}.book-content{padding:10px}.book-title{font-size:14px}}
</style></head><body>
<header><h1>Readingpedia</h1><nav class="header-buttons"><button onclick="location.href='index.html'">📊 Acervo</button><button class="active">📖 Em andamento</button></nav></header>
<main>
<div class="intro"><div class="eyebrow">Meu acompanhamento de leitura</div><h2>Leituras em andamento</h2><p class="subtitle">Um espaço para acompanhar o que você está lendo, no seu ritmo.</p></div>
<section class="stats"><div class="stat"><b>Livros em andamento</b><strong id="total-books">0</strong></div><div class="stat"><b>Páginas lidas</b><strong id="total-pages">0</strong></div><div class="stat"><b>Progresso médio</b><strong id="average-progress">0%</strong></div></section>
<section class="section"><div class="section-head"><h3>＋ Adicionar uma leitura</h3></div><p class="subtitle">Pesquise no seu acervo e adicione os livros que começou a ler.</p><div class="search-row"><input id="catalog-search" type="search" placeholder="Buscar por título ou autor..."><button class="primary-btn" id="clear-search">Limpar</button></div><div id="catalog-results" class="catalog-results"></div></section>
<section class="section"><div class="section-head"><h3>Estou lendo</h3><span class="subtitle" id="list-count">0 livros</span></div><div id="reading-list" class="books-grid"></div></section>
</main><div class="toast" id="toast" role="status"></div>
<script>
const STORAGE_KEY="readingpedia_em_andamento_v1";let books=[];let reading=loadReading();
function loadReading(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(saved)?saved:[]}catch(e){return []}}
function saveReading(){localStorage.setItem(STORAGE_KEY,JSON.stringify(reading));renderAll()}
function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function bookId(b){return String(b.ISBN||`${b.TITLE}|${b.AUTHOR}`)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2200)}
function getBook(id){return books.find(b=>bookId(b)===id)}
function addBook(id){if(reading.some(x=>x.id===id))return;const b=getBook(id);if(!b)return;reading.push({id,currentPage:0,notes:"",addedAt:new Date().toISOString()});saveReading();renderCatalog();toast("Livro adicionado às leituras em andamento.")}
function updateProgress(id,field,value){const item=reading.find(x=>x.id===id),b=getBook(id);if(!item||!b)return;if(field==="currentPage")item.currentPage=Math.max(0,Math.min(Number(b.PAGES)||0,Number(value)||0));else if(field==="notes")item.notes=value;saveReading()}
function finishBook(id){reading=reading.filter(x=>x.id!==id);saveReading();renderCatalog();toast("Leitura concluída e retirada desta lista.")}
function removeBook(id){reading=reading.filter(x=>x.id!==id);saveReading();renderCatalog();toast("Livro removido da lista.")}
function renderStats(){const pages=reading.reduce((s,x)=>s+Math.min(Number(x.currentPage)||0,Number(getBook(x.id)?.PAGES)||0),0);const avg=reading.length?Math.round(reading.reduce((s,x)=>{const total=Number(getBook(x.id)?.PAGES)||0;return s+(total?Math.min(100,(Number(x.currentPage)||0)/total*100):0)},0)/reading.length):0;document.getElementById("total-books").textContent=reading.length;document.getElementById("total-pages").textContent=pages.toLocaleString("pt-BR");document.getElementById("average-progress").textContent=avg+"%";document.getElementById("list-count").textContent=reading.length+" "+(reading.length===1?"livro":"livros")}
function renderReading(){const box=document.getElementById("reading-list"),list=reading.filter(x=>getBook(x.id));if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Nenhuma leitura em andamento por enquanto.</strong>Pesquise um título no campo acima para começar a acompanhar seu progresso.</div>';return}
box.innerHTML=list.map(item=>{const b=getBook(item.id),total=Number(b.PAGES)||0,current=Math.min(total,Math.max(0,Number(item.currentPage)||0)),pct=total?Math.round(current/total*100):0;return `<article class="book-card"><div class="cover"><img src="${esc(String(b.CAPA||"").trim())}" alt="Capa de ${esc(b.TITLE)}" loading="lazy" onerror="this.style.visibility='hidden'"></div><div class="book-content"><div class="book-title">${esc(b.TITLE)}</div><div class="author">${esc(b.AUTHOR)}</div><div class="meta">${b.SERIES?`<span class="chip">${esc(b.SERIES)}</span>`:""}${total?`<span class="chip pages">${total} páginas</span>`:""}${b.FORMAT?`<span class="chip">${b.FORMAT==="K"?"Kindle":"Físico"}</span>`:""}</div><div class="progress-line"><span>Progresso da leitura</span><strong>${pct}%</strong></div><progress max="100" value="${pct}"></progress><div class="progress-controls"><input aria-label="Páginas lidas" type="range" min="0" max="${total||100}" value="${current}" data-id="${esc(item.id)}" class="page-range"><input aria-label="Número de páginas lidas" type="number" min="0" max="${total||99999}" value="${current}" data-id="${esc(item.id)}" class="page-number"></div><textarea class="notes" placeholder="Anotações sobre esta leitura..." data-id="${esc(item.id)}">${esc(item.notes||"")}</textarea><div class="card-actions"><button class="remove" data-id="${esc(item.id)}">Remover</button><button class="finish" data-id="${esc(item.id)}">✓ Concluir leitura</button></div></div></article>`}).join("");
box.querySelectorAll(".page-range").forEach(el=>el.addEventListener("change",e=>{const n=box.querySelector(`.page-number[data-id="${CSS.escape(e.target.dataset.id)}"]`);if(n)n.value=e.target.value;updateProgress(e.target.dataset.id,"currentPage",e.target.value)}));
box.querySelectorAll(".page-number").forEach(el=>el.addEventListener("change",e=>updateProgress(e.target.dataset.id,"currentPage",e.target.value)));
box.querySelectorAll(".notes").forEach(el=>el.addEventListener("change",e=>updateProgress(e.target.dataset.id,"notes",e.target.value)));
box.querySelectorAll(".finish").forEach(el=>el.addEventListener("click",()=>finishBook(el.dataset.id)));box.querySelectorAll(".remove").forEach(el=>el.addEventListener("click",()=>removeBook(el.dataset.id)))}
function renderCatalog(){const q=normalize(document.getElementById("catalog-search").value),active=new Set(reading.map(x=>x.id)),matches=books.filter(b=>!active.has(bookId(b))&&(!q||normalize(b.TITLE).includes(q)||normalize(b.AUTHOR).includes(q))).slice(0,12),box=document.getElementById("catalog-results");if(!q){box.innerHTML='<div class="empty" style="grid-column:1/-1">Digite o título ou o nome do autor para localizar um livro do seu acervo.</div>';return}if(!matches.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum livro encontrado com essa busca (ou todos já foram adicionados).</div>';return}box.innerHTML=matches.map(b=>`<div class="catalog-item"><img src="${esc(String(b.CAPA||"").trim())}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="catalog-info"><b>${esc(b.TITLE)}</b><small>${esc(b.AUTHOR)}</small></div><button data-id="${esc(bookId(b))}">＋ Adicionar</button></div>`).join("");box.querySelectorAll("button").forEach(el=>el.addEventListener("click",()=>addBook(el.dataset.id)))}
function renderAll(){renderStats();renderReading()}
document.getElementById("catalog-search").addEventListener("input",renderCatalog);document.getElementById("clear-search").addEventListener("click",()=>{document.getElementById("catalog-search").value="";renderCatalog()});
fetch("./books.json").then(r=>{if(!r.ok)throw Error("Falha ao carregar books.json");return r.json()}).then(data=>{books=Array.isArray(data)?data:[];renderAll();renderCatalog()}).catch(err=>{document.getElementById("catalog-results").innerHTML='<div class="empty" style="grid-column:1/-1">Não foi possível carregar o acervo. Verifique se books.json está na mesma pasta desta página.</div>';renderAll();console.error(err)});
</script></body></html>
